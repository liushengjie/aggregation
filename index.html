<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>棱镜聚合 - 全网实时监测</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f43f5e;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbar - Smooth & Minimal */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .ipad-glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Masonry grid layout */
    .masonry-grid {
      display: flex;
      margin-left: -0.5rem; /* gutter size offset - smaller on mobile */
      width: auto;
    }
    
    @media (min-width: 1024px) {
      .masonry-grid {
        margin-left: -0.75rem;
      }
    }
    
    .masonry-grid_column {
      padding-left: 0.5rem; /* gutter size - 列之间的水平间距 - smaller on mobile */
      background-clip: padding-box;
    }
    
    @media (min-width: 1024px) {
      .masonry-grid_column {
        padding-left: 0.75rem;
      }
    }
    
    /* 卡片之间的垂直间距 */
    .masonry-grid_column > * {
      margin-bottom: 0.5rem;
    }
    
    @media (min-width: 1024px) {
      .masonry-grid_column > * {
        margin-bottom: 0.75rem;
      }
    }

    .mesh-bg {
      background-color: #f3f4f6;
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
    }
  </style>
</head>

<body class="mesh-bg text-slate-800 selection:bg-indigo-500/20 selection:text-indigo-700">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
