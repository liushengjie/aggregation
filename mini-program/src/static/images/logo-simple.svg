<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 六边形棱镜 -->
  <g transform="translate(60, 60)">
    <polygon 
      points="-30,-18 30,-18 36,0 30,18 -30,18 -36,0" 
      fill="url(#grad1)" 
      stroke="white" 
      stroke-width="1.5"
      filter="url(#shadow)"
    />
    
    <!-- 内部光线 -->
    <polygon 
      points="-24,-12 24,-12 28,0 24,12 -24,12 -28,0" 
      fill="white" 
      opacity="0.3"
    />
    
    <!-- 光线折射 -->
    <line x1="-36" y1="-12" x2="36" y2="12" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="-36" y1="12" x2="36" y2="-12" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.9"/>
  </g>
</svg>

