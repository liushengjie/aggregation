<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="32" cy="32" r="30" fill="url(#iconGrad)"/>
  
  <!-- 六边形棱镜 -->
  <g transform="translate(32, 32)">
    <polygon 
      points="-16,-10 16,-10 20,0 16,10 -16,10 -20,0" 
      fill="white" 
      opacity="0.9"
    />
    
    <!-- 内部光线 -->
    <line x1="-18" y1="-6" x2="18" y2="6" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="-18" y1="6" x2="18" y2="-6" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>

